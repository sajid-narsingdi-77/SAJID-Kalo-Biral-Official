<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SAJID Private Empire - 20 Lakh Elite Dashboard</title>
    <style>
        :root {
            --gold-primary: #FFD700;
            --gold-secondary: #DAA520;
            --dark-velvet: #0B0B0B;
            --card-bg: #141414;
            --text-light: #F5F5F5;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--dark-velvet);
            color: var(--text-light);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 480px;
            background: var(--card-bg);
            border: 2px solid var(--gold-secondary);
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 0 25px rgba(218, 165, 32, 0.3);
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .container::before {
            content: '👑';
            font-size: 50px;
            position: absolute;
            top: -10px;
            right: -10px;
            opacity: 0.15;
        }

        h1 {
            color: var(--gold-primary);
            font-size: 24px;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .subtitle {
            font-size: 14px;
            color: #aaa;
            margin-bottom: 25px;
        }

        .vault-box {
            background: linear-gradient(135deg, #1a1a1a, #2a2a2a);
            border: 1px solid var(--gold-primary);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .vault-title {
            font-size: 13px;
            color: var(--gold-secondary);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }

        .vault-amount {
            font-size: 32px;
            font-weight: bold;
            color: var(--gold-primary);
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.4);
        }

        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }

        label {
            display: block;
            font-size: 13px;
            color: var(--gold-secondary);
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            padding: 12px 15px;
            background: #000;
            border: 1px solid #444;
            border-radius: 10px;
            color: #fff;
            font-size: 16px;
            outline: none;
            transition: 0.3s;
        }

        input:focus {
            border-color: var(--gold-primary);
            box-shadow: 0 0 8px rgba(255, 215, 0, 0.3);
        }

        .btn-elite {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, var(--gold-primary), var(--gold-secondary));
            border: none;
            border-radius: 10px;
            color: #000;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 4px 15px rgba(255, 215, 0, 0.3);
            transition: 0.3s;
        }

        .btn-elite:active {
            transform: scale(0.98);
        }

        .footer-tag {
            margin-top: 20px;
            font-size: 12px;
            color: #777;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>SAJID EMPIRE</h1>
        <div class="subtitle">24K Gold Executive Vault & Management</div>

        <div class="vault-box">
            <div class="vault-title">Target Capital / Fund</div>
            <div class="vault-amount">৳ ২০,০০,০০০</div>
        </div>

        <div class="input-group">
            <label for="investorName">Executive / Partner Name</label>
            <input type="text" id="investorName" placeholder="Enter name...">
        </div>

        <button class="btn-elite" onclick="claimStatus()">Authorize Asset</button>

        <div class="footer-tag">SECURE MOBILE DEPLOYMENT v1.0</div>
    </div>

    <script>
        function claimStatus() {
            const name = document.getElementById('investorName').value;
            if(name.trim() === "") {
                alert("দয়া করে নাম লিখুন!");
            } else {
                alert("স্বাগতম, " + name + "! ২০ লাখ টাকার ভিআইপি গোল্ড টার্গেট সক্রিয় করা হয়েছে।");
            }
        }
    </script>

</body>
</html>
